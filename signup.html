<!DOCTYPE html>
<html>
  <head>
    
    <title>SyncStep</title>
    <meta charset="utf-8" />
	  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
	  <meta name="viewport" content="width=device-width, initial-scale=1" />

	  <!-- link the webpage's stylesheet -->
	  <link rel="stylesheet" href="/login.css" />
	  <link rel="stylesheet" href="/general-style.css" />

	  <!-- link the webpage's JavaScript file -->
	  <!-- Firebase (Auth, Firestore, Storage) — shared config, imported by script.js -->
	  <script type="module" src="/firebase-init.js"></script>

	  <!-- link the webpage's JavaScript file (type="module" so MediaPipe's import syntax works) -->
	  <script type="module" src="/script.js" defer></script>

    </head>
    <body>
        <header>
            <h2 class="gradient-text">SyncStep</h2>
		</header>
        <div class="login-box">
            <form class="login-form" id="login-form">
                <h2>Sign Up</h2>
                <div id="fname" class="form-group">
                    <label for="fname">First Name:</label>
                    <br>
                    <input type="text" id="fname" name="fname" required>
                </div>
                <div id="lname" class="form-group">
                    <label for="lname">Last Name:</label>
                    <br>
                    <input type="text" id="lname" name="lname" required>
                </div>
                <div id="email" class="hidden">
                    <label for="email">Email:</label>
                    <br>
                    <input type="email" id="email" name="email" required>
                </div>
                <div id="password" class="hidden">
                    <label for="password">Password:</label>
                    <br>
                    <input type="password" id="password" name="password" required>
                </div>
                <div id="password" class="hidden">
                    <label for="password">Confirm Password:</label>
                    <br>
                    <input type="password" id="password" name="password" required>
                </div>
                <button id="next" type="submit">Next</button>
                <button class="hidden" id="sign-up" type="submit">Sign Up</button>
                <hr>
            </form>
            <button id="google-signup-button">Sign up with Google</button>
            <h5>Already have an account? <a href="login.html">Login</a></h5>
        </div>
    </body>
</html>
